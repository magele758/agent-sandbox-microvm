[package]
name = "guest-agent"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "guest-agent"
path = "src/main.rs"

[dependencies]
axum = "0.7"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
